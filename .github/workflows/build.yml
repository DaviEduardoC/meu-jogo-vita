name: Criar VPK para PS Vita

on:
  push:
    branches: [ "principal", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Baixar codigo fonte
        uses: actions/checkout@v4

      - name: Compilar e Instalar vitaGL
        run: |
          git clone https://github.com/Rinnegatamante/vitaGL.git
          cd vitaGL
          mkdir -p build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=/usr/local/vitasdk/share/vita.toolchain.cmake ..
          make
          make install
          cd ../..

      - name: Compilar Jogo VPK
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=/usr/local/vitasdk/share/vita.toolchain.cmake ..
          make

      - name: Enviar VPK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: jogo-psvita
          path: build/*.vpk
