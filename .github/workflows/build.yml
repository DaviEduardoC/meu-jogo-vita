name: Criar VPK para PS Vita

on:
  push:
    branches: [ "principal", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Baixar codigo fonte
        uses: actions/checkout@v4

      - name: Compilar VPK
        run: |
          mkdir -p build
          cd build
          cmake ..
          make

      - name: Enviar VPK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: jogo-psvita
          path: build/*.vpk
